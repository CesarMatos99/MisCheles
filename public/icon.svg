<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="10" stroke-dasharray="16 12"/>
  
  <!-- Main Wallet / Vault Icon Group -->
  <g filter="url(#shadow)" transform="translate(96, 116)">
    <!-- Wallet body -->
    <rect x="10" y="50" width="300" height="200" rx="36" fill="#ffffff" />
    <rect x="10" y="50" width="300" height="70" rx="36" fill="#e0f2fe" opacity="0.6"/>
    
    <!-- Bank card / money slip sticking out -->
    <rect x="50" y="10" width="220" height="70" rx="14" fill="url(#goldGrad)"/>
    <circle cx="230" cy="45" r="16" fill="#ffffff" opacity="0.8"/>
    <circle cx="210" cy="45" r="16" fill="#ffffff" opacity="0.5"/>
    
    <!-- Wallet clasp / button flap -->
    <path d="M 210,120 L 310,120 A 30,30 0 0 1 310,180 L 210,180 Z" fill="#047857" />
    <circle cx="270" cy="150" r="14" fill="#fbbf24" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Currency / Growth symbol on wallet -->
    <path d="M 80,150 L 150,150 M 115,120 L 115,180 M 100,130 C 130,120 135,140 115,150 C 95,160 100,180 130,170" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
