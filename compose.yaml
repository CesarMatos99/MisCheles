services:
  web:
    build: .
    ports:
      - "${MISCHELES_PORT:-5174}:3000"
    environment:
      VITE_USE_POLLING: "true"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
